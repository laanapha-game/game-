<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Lannapha Trick or Treat</title>
  </head>
  <body>
    <div id="game"></div>
    <!-- Shown until the game draws its first frame; replaced by any start-up error, so a
         phone never shows a silent black page. Viewers that do not run JavaScript
         (iOS Files / Quick Look preview) only ever see this message. -->
    <div id="boot" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;color:#FFFF4F;font:14px/1.5 sans-serif;text-align:center;background:#000">
      กำลังโหลด… / Loading…<br />ถ้าไม่ขึ้น ให้เปิดลิงก์นี้ใน Safari หรือ Chrome<br />(If nothing appears, open this in Safari or Chrome.)
    </div>
    <noscript><style>#boot{display:flex!important}</style></noscript>
    <script>
      window.addEventListener('error', function (e) {
        var b = document.getElementById('boot');
        if (b) { b.style.display = 'flex'; b.style.color = '#DE5238'; b.textContent = 'Error: ' + (e.message || e); }
      });
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
