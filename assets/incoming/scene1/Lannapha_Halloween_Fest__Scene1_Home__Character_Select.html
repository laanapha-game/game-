function birdSprite(blink){
  const w = 24, h = 28;

  const has = (a,x,y) => a.some(p => p[0]===x && p[1]===y);
  return sprite(w,h,(x,y)=>{
    if (sh.inside(x,y)){
      if (sh.edge(x,y)) return COL.black;
      if (has(eL,x,y) || has(eR,x,y)) return COL.black;
      if (y===9 && x>=10 && x<=13) return COL.magenta;
      if (y===10 && (x===11 || x===12)) return COL.magenta;
      if (y<=13) return COL.white;
      if (y===14) return (x+y)%2 ? COL.pink : COL.white;
      if (y<=16) return COL.pink;
      if (y===17) return (x+y)%2 ? COL.magenta : COL.pink;
      return COL.magenta;
    }
    if ((x===8 || x===15) && (y===24 || y===25)) return COL.green;

    if (y===27 && ((x>=6&&x<=10) || (x>=13&&x<=17))) return COL.blue;
    return null; });
}

  for (let by=y+4; by<y+h-5; by+=6) bulb(x+w-3,by);
  for (let bx=x+w-8; bx>=x+4; bx-=6) bulb(bx,y+h-3);
  for (let by=y+h-8; by>=y+4; by-=6) bulb(x+1,by); }
function bigButton(b,label,id,t){ const p = pressed === id, o = p ? 1 : 0;
  ctx.fillStyle = COL.yellow; ctx.fillRect(b.x-2,b.y-2+o,b.w+4,b.h+4); ctx.fillStyle = p ? COL.yellow : COL.magenta; ctx.fillRect(b.x,b.y+o,b.w,b.h);
  if (!p){ ctx.fillStyle = COL.dmagenta; ctx.fillRect(b.x,b.y+b.h-2,b.w,2); }
  const sp = thaiSprite(label,COL.black,13), cx = b.x+b.w/2; ctx.drawImage(sp,Math.round(cx-sp.width/2),b.y-2+o);
  if (Math.floor(t*2) % 2 === 0){ text('>',Math.round(cx-sp.width/2)-9,b.y+6+o,COL.black,'l'); text('<',Math.round(cx+sp.width/2)+4,b.y+6+o,COL.black,'l'); } }
function drawSelect(now,t){
  drawSky(t); ctx.fillStyle = COL.black; ctx.fillRect(0,134,W,H-134); ctx.fillStyle = COL.magenta; ctx.fillRect(0,134,W,1);
  ctx.drawImage(discSp,44,40); ctx.drawImage(pedSp,58,118);
  const c = CHARS[who], hp = (now-charHop)/450, hy = (hp >= 0 && hp < 1) ? -Math.round(Math.sin(hp*Math.PI)*12) : 0;
  drawChar(c.id,'front',frontFrame(t),90,127,2,hy);
  const nx = (Math.floor(t*2) % 2) ? 1 : 0, pl = pressed === 'left' ? 1 : 0, pr = pressed === 'right' ? 1 : 0;
  ctx.drawImage(arrowL, SELBTN.left.x+5-nx, SELBTN.left.y+6+pl); ctx.drawImage(arrowR, SELBTN.right.x+5+nx, SELBTN.right.y+6+pr);
  bulbPanel(26,5,128,26,t); thaiC(TITLE,90,10,COL.yellow,13); drawSpeaker();
  { const b = SELBTN.back, p = pressed === 'back'; ctx.fillStyle = COL.yellow; ctx.fillRect(b.x-1,b.y-1,b.w+2,b.h+2); ctx.fillStyle = p ? COL.yellow : COL.black; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.drawImage(arrowS,b.x+6,b.y+4); }
  ctx.fillStyle = COL.yellow; ctx.fillRect(13,137,154,26); ctx.fillStyle = COL.black; ctx.fillRect(14,138,152,24);
  { const label = i0 => i0 === 0 ? c.name + ' · ' + c.tag : c.name; let px = 16, sp = thaiSprite(label(who),COL.yellow,16); if (sp.width > 146){ px = 13; sp = thaiSprite(label(who),COL.yellow,13); }
    ctx.drawImage(sp, Math.round(90 - sp.width/2), px === 16 ? 135 : 139); }
  CHARS.forEach((ch,i) => { const b = SELBTN['c'+i], sel = i === who, p = pressed === 'c'+i;
    ctx.fillStyle = sel ? ((Math.floor(t*3) % 2) ? COL.yellow : COL.white) : COL.dred; ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle = p ? COL.ddred : COL.black; ctx.fillRect(b.x+2,b.y+2,b.w-4,b.h-4);
    drawChar(ch.id,'front',sel ? frontFrame(t) : 'idle0',b.x+b.w/2,b.y+b.h-2,1,0); });
  bigButton(SELBTN.confirm,CONFIRM_LABEL,'confirm',t);
  ctx.fillStyle = COL.yellow; ctx.fillRect(6,280,168,36); ctx.fillStyle = COL.black; ctx.fillRect(7,281,166,34);
  { const lp = thaiSprite(PREVIEW_LABEL,COL.yellow,12); ctx.drawImage(lp,11,280); }
  ctx.fillStyle = COL.dred; ctx.fillRect(7,313,166,1);
  for (let x=-18+Math.floor((t*40)%18); x<166; x+=18) ctx.fillRect(7+Math.max(0,x),315,Math.min(8,166-Math.max(0,x)),1);   /* ground slides right while walking left */
  drawChar(c.id,'side',walkFrame(t),104,313,1,0);
  ctx.drawImage(ghostSp, 142 + Math.round(Math.sin(t*1.7)*3), 286); }

/* ===== scene 2 placeholder: walking left. Replace it with the real scene (see LannaphaGame.registerScene below) ===== */
const stubCity = mkCanvas(180,60), sc0 = stubCity.getContext('2d');
{ const rr = rnd(11); let x = 0; while (x < 180){ const w = 16 + Math.floor(rr()*16), h = 20 + Math.floor(rr()*34); sc0.fillStyle = rr() < 0.5 ? COL.ddred : COL.black; sc0.fillRect(x,60-h,Math.min(w,180-x),h); x += w + 2; } }
let stubSel = { id:'nuannapa', name:'' };
registerScene('scene2', {
  enter(data){ stubSel = data || stubSel; },
  draw(now,t){
    drawSky(t); ctx.fillStyle = COL.black; ctx.fillRect(0,GROUND,W,H-GROUND); ctx.fillStyle = COL.dred; ctx.fillRect(0,GROUND,W,3);
    const off = Math.floor((t*30) % 180); ctx.drawImage(stubCity,off-180,GROUND-60); ctx.drawImage(stubCity,off,GROUND-60);
    ctx.fillStyle = COL.dred; for (let x=-20+Math.floor((t*60)%20); x<W; x+=20) ctx.fillRect(Math.max(0,x),GROUND+12,10,1);
    drawChar(stubSel.id,'side',walkFrame(t),118,GROUND,1,0);
    ctx.drawImage(ghostSp,150+Math.round(Math.sin(t*2)*3),GROUND-27);
    text('SCENE 2',90,16,COL.yellow,'c'); thaiC('ตัวอย่างเดินซ้าย',90,26,COL.white,13); text('PLACEHOLDER',90,46,COL.magenta,'c');
    const names = ['idle','walk','struggle','scared'], lab = ['IDLE','WALK','STRUG','SCARE'];
    const fr = [idleFrame(t), walkFrame(t), (Math.floor(t*4)%2) ? 'struggle1' : 'struggle0', 'scared'];
    for (let i=0;i<4;i++){ const x = 8+i*42; ctx.fillStyle = COL.yellow; ctx.fillRect(x,262,38,42); ctx.fillStyle = COL.black; ctx.fillRect(x+1,263,36,40);
      drawChar(stubSel.id,'side',fr[i],x+19,301,1,0); text(lab[i],x+19,264,COL.white,'c'); }
    text('TAP TO GO BACK',90,310,COL.white,'c'); },
  onTap(){ go('select'); }
});

function drawOverlays(now){
  if (toast){ if (now > toast.until) toast = null; else { const w = toast.s.length*6-1+12, x = Math.round((W-w)/2), y = 150;
    ctx.fillStyle = COL.yellow; ctx.fillRect(x-1,y-1,w+2,17); ctx.fillStyle = COL.black; ctx.fillRect(x,y,w,15); text(toast.s,90,y+4,COL.white,'c'); } }
  if (fade){ const p = (now - fade.t) / fade.dur;
    if (p >= 1) fade = null; else { if (p >= 0.5 && !fade.swapped){ if (scenes[state] && scenes[state].exit) scenes[state].exit(); state = fade.next; fade.swapped = true; if (scenes[state] && scenes[state].enter) scenes[state].enter(fade.data); }
      ctx.globalAlpha = p < 0.5 ? p*2 : 1-(p-0.5)*2; ctx.fillStyle = COL.black; ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; } } }
function frame(){ const now = performance.now(), t = now/1000;
  if (state === 'home') drawHome(now,t); else if (state === 'select') drawSelect(now,t); else if (scenes[state]) scenes[state].draw(now,t); else drawHome(now,t);
  drawOverlays(now); requestAnimationFrame(frame); }
/* ===== PUBLIC API: how the real scene 2 plugs in =====
   LannaphaGame.registerScene('scene2', {
     enter(data){ ... },            // data = { id, name } of the chosen character (see LannaphaGame.characters)
     draw(now,t){ ... },            // called every frame; draw into the 180 x 320 canvas (use LannaphaGame.ctx)
     onTap(x,y){ ... },             // optional; the default goes back to character select
     exit(){ ... } });              // optional
   Sprites: LannaphaGame.getSprite(id,'side','walk0') returns a 32 x 36 canvas (facing LEFT); frame names are in
   LannaphaGame.frames. The same frames are exported as PNG sheets in assets/characters/ (see characters.json).
   When the player loses call LannaphaGame.goHome(); when they win, go on to scene 3 with LannaphaGame.go('scene3', data). */
window.LannaphaGame = { ctx, W, H, GROUND, COL, characters: CHARS.map(c => ({ id:c.id, name:c.name })), selected: selection,
  frames: { cell:{ w:CW, h:CH }, side:SIDE_FRAMES, front:FRONT_FRAMES, anim:ANIM },
  getSprite: charSprite, drawChar, walkFrame, idleFrame, registerScene, go, goHome: () => go('home'), goSelect: () => go('select') };
requestAnimationFrame(frame);
})();
